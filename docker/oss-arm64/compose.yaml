services:

  mongoDB:
    image: mongo:4.4.18
    container_name: graylog-mongo
    restart: unless-stopped
    environment:
      TZ: "Europe/London"
    volumes:
      - type: volume
        source: graylog-mongoDB
        target: /data/db
    networks:
      Graylog:
        aliases:
          - mongo

  opensearch:
    image: opensearchproject/opensearch:1.3.20
    container_name: graylog-opensearch
    restart: unless-stopped
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      cluster.name: "opensearch-cluster"
      node.name: "opensearch-node1"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      bootstrap.memory_lock: "true"
      discovery.type: "single-node"
      http.host: "0.0.0.0"
      action.auto_create_index: "false"
      TZ: "Europe/London"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - type: volume
        source: graylog-opensearch
        target: /usr/share/opensearch/data
    networks:
      Graylog:
        aliases:
          - opensearch

  graylog:
    image: phantomski/graylog:4.3.15-arm64-java23
    container_name: graylog
    restart: unless-stopped
    ports:
      # Graylog WebGUI and REST API:
      - 9001:9000
      # Syslog TCP:
      - 1514:1514
      # Syslog UDP:
      - 1514:1514/udp
      # GELF TCP:
      - 12201:12201
      # GELF UDP:
      - 12201:12201/udp
      # Syslog Raw/Plaintext UDP
      - 5555:5555/udp
      # Prometheus metrics
      - 9833:9833
    environment:
      GRAYLOG_NODE_ID_FILE: "/usr/share/graylog/data/config/node-id"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://localhost:9000" # Change to your domain / local Graylog machine URL
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongo:27017/graylog"
      TZ: "Europe/London"
    entrypoint: "/usr/bin/tini -- wait-for-it opensearch:9200 --  /docker-entrypoint.sh"
    volumes:
      - type: volume
        source: graylog-data
        target: /usr/share/graylog/data
    networks:
      - Graylog
    depends_on:
      mongoDB:
        condition: "service_started"
      opensearch:
        condition: "service_started"

networks:
  Graylog: 
    name: Graylog
volumes:
  graylog-mongoDB:
    name: graylog-mongoDB
    external: true
  graylog-opensearch:
    name: graylog-opensearch
  graylog-data:
    name: graylog-data
    external: true
